services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY debe estar definida}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS debe estar definida}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL debe estar definida}
    command: sh -c "uv run manage.py collectstatic --noinput && uv run manage.py migrate && uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
