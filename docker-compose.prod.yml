services:
  web:
    image: website:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:${PORT:-8000}"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY debe estar definida}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS debe estar definida}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL debe estar definida}
      - ANALYTICS_SALT=${ANALYTICS_SALT:?ANALYTICS_SALT debe estar definida}
      - PORT=${PORT:-8000}
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-webmaster@localhost}
