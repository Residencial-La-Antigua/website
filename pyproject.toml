[project]
name = "website"
version = "0.1.0"
description = "Sitio de información y herramientas en línea del residencial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "tzdata>=2026.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["RUF012"]
