name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run manage.py test

  # Runs on a self-hosted runner installed directly on the target VM (see
  # DEPLOYMENT.md), not a GitHub-hosted runner. The VM's NSG only allows SSH
  # from a single whitelisted admin IP, which GitHub-hosted runners can't
  # satisfy since their IPs are large, rotating ranges.
  deploy:
    needs: test
    runs-on: [self-hosted, Linux, X64]
    env:
      IMAGE_TAG: website:latest
    steps:
      - uses: actions/checkout@v7

      - name: Write env file for the container
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANALYTICS_SALT: ${{ secrets.ANALYTICS_SALT }}
        run: |
          {
            echo "SECRET_KEY=$SECRET_KEY"
            echo "ALLOWED_HOSTS=$ALLOWED_HOSTS"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "ANALYTICS_SALT=$ANALYTICS_SALT"
          } > .env

      - name: Build image
        run: docker build -t "$IMAGE_TAG" .

      - name: Restart the app
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env up -d
          docker image prune -f
