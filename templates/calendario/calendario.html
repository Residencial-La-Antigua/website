{% extends "base.html" %}
{% load static %}

{% block title %}Calendario — Residencial La Antigua{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/calendario.css' %}" />
{% endblock %}

{% block content %}
  <div class="card calendar-card">
    <header>
      <h1>Calendario de Eventos</h1>
      <div class="calendar-controls">
        <label for="year-select">Año</label>
        <select id="year-select"></select>
      </div>
    </header>
    <div
      id="calendar"
      data-events-url="{% url 'calendario-eventos' %}"
    ></div>
  </div>

  <dialog id="event-modal" class="event-modal">
    <form method="dialog" class="event-modal-form">
      <h2 id="event-modal-title"></h2>
      <p id="event-modal-schedule" class="event-modal-schedule"></p>
      <p id="event-modal-location" class="event-modal-location"></p>
      <p id="event-modal-description" class="event-modal-description"></p>
      <button type="submit" class="btn">Cerrar</button>
    </form>
  </dialog>
{% endblock %}

{% block extra_js %}
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/es.global.min.js"></script>
  <script src="{% static 'js/calendario.js' %}"></script>
{% endblock %}
