{% extends "base.html" %} {% block title %}Registrarse{% endblock %}
{% block content %}
<div class="card signup">
  <h1>Registrarse</h1>
  <form method="post">
    {% csrf_token %} {{ form.as_p }}
    <button type="submit" class="btn">Crear cuenta</button>
  </form>
  <p><a href="{% url 'login' %}">¿Ya tienes cuenta? Inicia sesión</a></p>
</div>
{% endblock %}
